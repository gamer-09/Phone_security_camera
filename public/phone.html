<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070d" />
  <link rel="icon" href="data:," />
  <title>SEC-CAM // PHONE UNIT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="phone-ui">
  <div class="phone-app">
    <video id="preview" autoplay playsinline muted></video>
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <!-- top HUD -->
    <header class="hud-top">
      <div class="brand">
        <i class="dot"></i>
        <span>SEC-CAM</span>
        <span class="tag">UNIT-01</span>
        <span class="tag sim" id="simBadge" hidden>SIM CAM</span>
        <span class="tag relay" id="relayBadge" hidden>RELAY</span>
        <span class="tag offline" id="offlineBadge" hidden>OFFLINE</span>
      </div>
      <div class="hud-cluster">
        <div class="hud-chip" id="qChip" title="Stream quality">Q --</div>
        <div class="hud-chip" id="nvChip" title="Night vision (auto-engages in the dark)">☾ --</div>
        <div class="hud-chip" id="talkChip" title="Viewer audio channel">TALK --</div>
        <div class="hud-chip" id="bat" title="Battery">◈ --%</div>
        <div class="hud-chip" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- centre status -->
    <div class="cam-status">
      <div class="status-pill standby" id="statusPill">STANDBY</div>
      <div class="onair" id="onAir">00:00</div>
    </div>

    <!-- control sheet -->
    <section class="ctl-sheet">
      <div class="ctl-row">
        <label class="ctl-label" for="selCam">CAM</label>
        <select id="selCam"></select>
        <label class="ctl-label" for="selMic">MIC</label>
        <select id="selMic"></select>
      </div>

      <div class="ctl-row">
        <label class="ctl-label">RES</label>
        <div class="seg" id="segRes"></div>
        <label class="ctl-label" for="viewerId">VIEWER</label>
        <input id="viewerId" placeholder="auto" spellcheck="false" autocomplete="off" />
        <input id="pin" placeholder="PIN" inputmode="numeric" maxlength="6" autocomplete="off" />
      </div>

      <div class="ctl-row">
        <label class="ctl-label" for="segNight">NIGHT</label>
        <div class="seg" id="segNight" title="Night vision — AUTO switches on when it gets dark">
          <button type="button" class="on" data-nv="auto">AUTO</button>
          <button type="button" data-nv="on">ON</button>
          <button type="button" data-nv="off">OFF</button>
        </div>
        <button class="btn auto-torch on" id="btnAutoTorch" type="button" title="Auto torch — the flashlight turns on automatically with night vision, so the camera has real light to see in total darkness">⌁ AUTO TORCH</button>
      </div>

      <div class="ctl-row ctl-actions">
        <button class="btn icon" id="btnFlip" title="Flip camera">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
        <button class="btn icon" id="btnTorch" title="Torch">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="btn icon on" id="btnMic" title="Toggle mic">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        </button>
        <button class="btn live" id="btnLive">● GO LIVE</button>
      </div>
    </section>
  </div>

  <button class="talk-unlock hidden" id="talkUnlock" type="button">🔊 TAP TO ENABLE VIEWER AUDIO</button>
    </section>
  </div>

  <button class="dbg-toggle" id="btnDbg" type="button" title="Toggle diagnostics log">LOG</button>
  <div class="dbg-panel" id="dbgPanel" hidden>
    <div class="dbg-head">EVENT LOG <button id="btnDbgClose" type="button" aria-label="Close log">×</button></div>
    <ul id="dbgList"></ul>
  </div>

  <div class="toast-wrap"></div>

  <!-- Night-vision gain filter (gamma lift + phosphor-green mapping) — the
       same #nvg def as the viewer, so the phone preview and the PC feed
       boost identically -->
  <svg aria-hidden="true" class="thermal-svg" focusable="false">
    <defs>
      <filter id="nvg" x="0%" y="0%" width="100%" height="100%">
        <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
        <feComponentTransfer>
          <feFuncR type="gamma" exponent="0.65" amplitude="1.5" offset="0.02"/>
          <feFuncG type="gamma" exponent="0.65" amplitude="1.5" offset="0.02"/>
          <feFuncB type="gamma" exponent="0.65" amplitude="1.5" offset="0.02"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.3" intercept="-0.08"/>
          <feFuncG type="linear" slope="1.3" intercept="-0.08"/>
          <feFuncB type="linear" slope="1.3" intercept="-0.08"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.03 0.08 0.18 0.45 0.95"/>
          <feFuncG type="table" tableValues="0.6 0.72 0.86 0.98 1"/>
          <feFuncB type="table" tableValues="0.12 0.24 0.4 0.7 1"/>
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <script src="/js/common.js"></script>
  <script src="/vendor/peerjs.min.js"></script>
  <script src="/js/phone.js"></script>
  <script>
    // offline-ready: cache the app shell so this page opens with zero
    // connectivity and waits for the PC (best-effort, never fatal)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
